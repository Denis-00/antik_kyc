<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYC — верификация личности</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.45 system-ui; }
  body { margin: 0; padding: 24px; max-width: 860px; }
  h1 { font-size: 1.4rem; }
  button { font: inherit; padding: 9px 14px; margin: 4px 6px 4px 0; }
  video { display: block; width: 100%; max-height: 46vh; background: #111; margin: 14px 0; }
  video[hidden] { display: none; }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; }
  th, td { border: 1px solid #8884; padding: 7px 9px; text-align: left; vertical-align: top; }
  td:first-child { white-space: nowrap; }
  .ok { color: #1a8f3c; font-weight: 700; }
  .bad { color: #d33; font-weight: 700; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; word-break: break-all; }
  #command { font-size: 1.1rem; font-weight: 700; margin: 6px 0; }
  #motion { font-family: ui-monospace, Menlo, monospace; }
  #verdict { font-size: 1.1rem; font-weight: 700; margin-top: 14px; padding: 12px; border-radius: 8px; }
  .risk-low { background: #1a8f3c22; color: #1a8f3c; }
  .risk-high { background: #d332; color: #d33; }
</style>
</head>
<body>
  <h1>KYC — верификация личности</h1>
  <p>Сайт запрашивает фронтальную камеру и проверяет, что видео действительно живое и пришло с честного устройства. Модель проверок повторяет публичные сигналы Persona: отпечаток, гео/VPN-детект, liveness с позами.</p>
  <button id="start">Начать верификацию</button>
  <button id="liveness" disabled>Активная liveness (позы Persona: влево/центр/вправо)</button>
  <video id="video" autoplay muted playsinline hidden></video>
  <p id="command">Команда: —</p>
  <p id="motion">Движение: —</p>

  <table>
    <thead><tr><th>Проверка</th><th>Результат</th><th>Детали</th></tr></thead>
    <tbody id="checks"></tbody>
  </table>

  <div id="verdict" hidden></div>

<script>
  const start = document.getElementById('start');
  const livenessBtn = document.getElementById('liveness');
  const video = document.getElementById('video');
  const checks = document.getElementById('checks');
  const command = document.getElementById('command');
  const motionEl = document.getElementById('motion');
  const verdict = document.getElementById('verdict');

  let stream = null;
  let track = null;

  function row(name, ok, detail) {
    const tr = document.createElement('tr');
    const n = document.createElement('td'); n.textContent = name;
    const r = document.createElement('td');
    r.innerHTML = ok ? '<span class="ok">✔ пройдено</span>' : '<span class="bad">✘ подозрительно</span>';
    const d = document.createElement('td');
    d.className = 'mono'; d.textContent = detail;
    tr.append(n, r, d);
    checks.append(tr);
    return ok;
  }

  function ipCountry() {
    return fetch('https://ipapi.co/json/', {cache: 'no-store'})
      .then(r => r.json())
      .then(j => ({country: j.country_code, city: j.city, ip: j.ip, org: j.org}))
      .catch(() => null);
  }

  async function runStaticChecks() {
    checks.innerHTML = '';
    let pass = 0, total = 0;

    total++;
    if (row('Метка камеры (label)', !!track.label && track.label.length > 0, JSON.stringify(track.label))) pass++;

    total++;
    const s = track.getSettings();
    const facing = s.facingMode;
    if (row('facingMode задан', facing === 'user' || facing === 'environment', JSON.stringify(facing))) pass++;

    total++;
    let devices = [];
    try { devices = await navigator.mediaDevices.enumerateDevices(); } catch {}
    const ids = devices.map(d => d.deviceId);
    const inList = ids.includes(s.deviceId);
    if (row('deviceId есть в enumerateDevices', inList, 'трек: ' + (s.deviceId || '—') + '\nсписок: ' + JSON.stringify(ids))) pass++;

    total++;
    const videos = devices.filter(d => d.kind === 'videoinput').length;
    const audios = devices.filter(d => d.kind === 'audioinput').length;
    if (row('Список камер реалистичен (≥2 видео + ≥1 аудио)', videos >= 2 && audios >= 1,
        'видео: ' + videos + ', аудио: ' + audios)) pass++;

    total++;
    let geo = null;
    try {
      geo = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, {timeout: 4000}));
    } catch (e) { geo = null; }
    if (geo) {
      const c = geo.coords;
      if (row('Геолокация доступна', true, c.latitude.toFixed(4) + ', ' + c.longitude.toFixed(4))) pass++;
    } else {
      row('Геолокация доступна', false, 'отказано / нет данных');
    }

    total++;
    if (geo && typeof GeolocationPosition !== 'undefined') {
      if (row('Тип GeolocationPosition', geo instanceof GeolocationPosition,
          'instanceof: ' + (geo instanceof GeolocationPosition))) pass++;
    } else {
      row('Тип GeolocationPosition', false, 'гео недоступна или тип неизвестен');
    }

    total++;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const lang = navigator.language;
    const ip = await ipCountry();
    const ipCountryCode = ip ? ip.country : null;
    const tzOk = tz === 'Europe/Berlin';
    const langOk = (lang || '').toLowerCase().startsWith('de');
    const ipOk = ipCountryCode === 'DE';
    const geoOk = tzOk && langOk && ipOk;
    if (row('Гео-согласованность (таймзона/язык/IP)',
        geoOk,
        'таймзона=' + tz + '\nязык=' + lang + '\nIP=' + (ip ? ipCountryCode + ' (' + ip.ip + ')' : 'нет данных'))) pass++;

    total++;
    const ua = navigator.userAgent;
    const safariLike = /\bVersion\//.test(ua) && /Safari\//.test(ua);
    if (row('UA похож на Safari', safariLike, ua)) pass++;

    total++;
    const hosting = /\b(hosting|cloud|vps|datacenter|digitalocean|amazon|aws|google|microsoft|azure|ovh|hetzner|linode|vultr|contabo|oracle|alibaba|tencent|m247|datacamp|cogent|psychz|leaseweb)\b/i;
    const hostingHit = !!(ip?.org && hosting.test(ip.org));
    if (row('IP не похож на датацентр/VPN (эвристика)', !hostingHit,
        'org: ' + (ip?.org ?? 'нет данных'))) pass++;

    total++;
    const rtc = typeof window.RTCPeerConnection === 'function' ||
      typeof window.webkitRTCPeerConnection === 'function';
    if (row('WebRTC API присутствует (как в Safari)', rtc,
        'RTCPeerConnection: ' + typeof window.RTCPeerConnection)) pass++;

    return {pass, total};
  }

  function renderVerdict(pass, total) {
    const risk = total - pass;
    verdict.hidden = false;
    verdict.className = risk === 0 ? 'risk-low' : 'risk-high';
    verdict.textContent = risk === 0
      ? `Верификация пройдена: ${pass}/${total} проверок чисто.`
      : `Подозрение: ${risk} из ${total} проверок не прошли.`;
  }

  async function runAudioCheck(context) {
    let pass = 0, total = 0;
    total++;
    const audio = stream ? stream.getAudioTracks()[0] : null;
    if (!audio) {
      row('Звук с микрофона', false, 'аудиодорожки нет');
      return {pass, total};
    }
    if (!context) {
      row('Звук с микрофона', false, 'AudioContext недоступен в этом браузере');
      return {pass, total};
    }
    try {
      if (context.state === 'suspended') await context.resume();
      const source = context.createMediaStreamSource(new MediaStream([audio]));
      const analyser = context.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      const buffer = new Float32Array(analyser.fftSize);
      let peak = 0;
      for (let i = 0; i < 12; i++) {
        await new Promise(resolve => setTimeout(resolve, 100));
        analyser.getFloatTimeDomainData(buffer);
        let sum = 0;
        for (const value of buffer) sum += value * value;
        peak = Math.max(peak, Math.sqrt(sum / buffer.length));
      }
      source.disconnect();
      const db = 20 * Math.log10(peak || 1e-9);
      const ok = peak > 1e-4;
      if (row('Звук: не цифровая тишина', ok,
          'уровень ' + db.toFixed(0) + ' дБ, RMS ' + peak.toExponential(2) + ', ctx=' + context.state)) pass++;
    } catch (error) {
      row('Звук: не цифровая тишина', false, String(error.message || error));
    }
    return {pass, total};
  }

  const POSES = [
    { key: 'left',   text: 'Поверните голову ВЛЕВО' },
    { key: 'center', text: 'Смотрите В ЦЕНТР' },
    { key: 'right',  text: 'Поверните голову ВПРАВО' }
  ];

  function shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function signature() {
    const c = document.createElement('canvas');
    c.width = 48; c.height = 32;
    const g = c.getContext('2d', {willReadFrequently: true});
    g.drawImage(video, 0, 0, 48, 32);
    const d = g.getImageData(0, 0, 48, 32).data;
    const sig = new Uint8Array(48 * 32);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) sig[j] = d[i];
    return sig;
  }

  function diff(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
    return s / a.length;
  }

  function liveness() {
    return new Promise(resolve => {
      const turns = shuffle(POSES.filter(p => p.key !== 'center')).slice(0, 2);
      const phases = [
        { kind: 'freeze', text: 'Смотрите прямо и НЕ ДВИГАЙТЕСЬ' },
        { kind: 'pose',   text: turns[0].text },
        { kind: 'freeze', text: 'Замрите и смотрите прямо' },
        { kind: 'pose',   text: turns[1].text }
      ];
      const results = phases.map(p => ({ kind: p.kind, max: 0 }));
      let index = 0;
      let prev = null;
      let currentMax = 0;
      let loopHit = false;
      const history = [];
      const startTime = performance.now();

      const tick = setInterval(() => {
        if (video.videoWidth === 0) return;
        const sig = signature();
        const t = performance.now() - startTime;
        if (prev) {
          currentMax = Math.max(currentMax, diff(sig, prev));
          history.push({t, sig});
          for (const h of history) {
            if (t - h.t > 1000 && diff(sig, h.sig) < 0.5) { loopHit = true; break; }
          }
        } else {
          history.push({t, sig});
        }
        prev = sig;
        motionEl.textContent = 'Движение: ' + currentMax.toFixed(2) +
          (loopHit ? '  |  ⚠ повтор кадра (цикл) — это запись' : '');
      }, 120);

      command.textContent = '1/4: ' + phases[0].text;

      const step = setInterval(() => {
        results[index].max = currentMax;
        currentMax = 0;
        index++;
        if (index >= phases.length) {
          clearInterval(tick);
          clearInterval(step);
          const freezeOk = results.filter(r => r.kind === 'freeze').every(r => r.max < 2.5);
          const poseOk = results.filter(r => r.kind === 'pose').every(r => r.max > 3);
          const ok = freezeOk && poseOk && !loopHit;
          const summary = results
            .map(r => (r.kind === 'freeze' ? 'пауза' : 'поза') + ' ' + r.max.toFixed(1))
            .join(' / ');
          command.textContent = 'Итог: ' + summary +
            (loopHit ? '  |  ⚠ цикл' : '') +
            ' — ' + (ok ? 'выполнено' : 'НЕ выполнено / запись');
          resolve(ok);
        } else {
          command.textContent = (index + 1) + '/4: ' + phases[index].text;
        }
      }, 2000);
    });
  }

  start.onclick = async () => {
    start.disabled = true;
    let audioContext = null;
    try {
      audioContext = new AudioContext();
      if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
    } catch (error) {
      console.warn('AudioContext недоступен:', error);
    }
    try {
      const request = navigator.mediaDevices.getUserMedia({video: {facingMode: 'user'}, audio: true});
      const timeout = new Promise((_, reject) =>
        setTimeout(() => reject(new Error('Камера не ответила за 10 секунд')), 10000));
      try {
        stream = await Promise.race([request, timeout]);
      } catch (error) {
        request.catch(() => {});
        throw error;
      }
      track = stream.getVideoTracks()[0];
      video.srcObject = stream;
      video.hidden = false;
      livenessBtn.disabled = false;
      const camera = await runStaticChecks();
      const audio = await runAudioCheck(audioContext);
      renderVerdict(camera.pass + audio.pass, camera.total + audio.total);
    } catch (e) {
      row('Получить камеру', false, String(e.message || e));
      verdict.hidden = false;
      verdict.className = 'risk-high';
      verdict.textContent = 'Камеру получить не удалось: ' + String(e.message || e);
    }
  };

  livenessBtn.onclick = async () => {
    livenessBtn.disabled = true;
    await liveness();
  };

  window.addEventListener('pagehide', () => { stream?.getTracks().forEach(t => t.stop()); });
</script>
</body>
</html>
